name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, graph, MCP and LLM-path tests (offline, no key)
        run: pytest -q
      - name: Quick evaluation
        run: python eval/run_eval.py --quick
      - name: App boots and runs the committee headless
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=600).run()
          assert not at.exception, at.exception
          [b for b in at.button if "Convene" in b.label][0].click().run()
          assert not at.exception, at.exception
          assert any("Recommended tender allocation" in m.value for m in at.markdown), "no allocation rendered"
          assert any("Approve" in b.label for b in at.button), "human review not shown"
          print("ok")
          PY
